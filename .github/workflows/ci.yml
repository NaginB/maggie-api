name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      matrix:
        node: [20, 22, 24]
        mongoose: [8.15.1, 8.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save mongoose@${{ matrix.mongoose }}
      - run: npm run check
